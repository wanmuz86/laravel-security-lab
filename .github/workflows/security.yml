name: Laravel Security Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The Laravel skeleton and vendor/ are built inside the Docker image (see Dockerfile),
      # so "install dependencies" means building and starting the application container.
      - name: Build and start the application
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8000/up && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Run tests
        run: docker compose exec -T app php artisan test
