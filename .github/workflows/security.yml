name: Laravel Security Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks git scans history; a shallow clone hides leaks

      - name: Prepare reports folder
        run: |
          mkdir -p reports
          chmod 777 reports # the ZAP container user must be able to write here

      # The Laravel skeleton and vendor/ are built inside the Docker image (see Dockerfile),
      # so "install dependencies" means building and starting the application container.
      - name: Build and start the application
        id: start_app
        continue-on-error: true
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl --fail --silent http://localhost:8000/up && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Pest tests
        id: pest
        if: steps.start_app.outcome == 'success'
        continue-on-error: true
        run: |
          docker compose exec -T app php artisan test --log-junit=/tmp/pest-junit.xml

      - name: Collect Pest report
        if: always() && steps.start_app.outcome == 'success'
        run: docker compose cp app:/tmp/pest-junit.xml reports/pest-junit.xml || true

      - name: PHPStan
        id: phpstan
        if: steps.start_app.outcome == 'success'
        continue-on-error: true
        run: |
          docker compose exec -T app sh -c 'rm -rf /tmp/phpstan; vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=json' > reports/phpstan.json

      - name: Composer Audit
        id: composer_audit
        continue-on-error: true
        run: composer audit --locked --no-interaction --format=json > reports/composer-audit.json

      - name: Install Gitleaks (pinned, checksum-verified)
        run: |
          V="$GITLEAKS_VERSION"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o gitleaks.tgz "$BASE/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz checksums.txt
          gitleaks version

      - name: Gitleaks secret scan
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path reports/gitleaks.json

      - name: Build container image
        id: docker_build
        continue-on-error: true
        run: docker build -t laravel-security-lab:ci .

      # Blocks on fixable HIGH/CRITICAL only: the Debian base has unfixed findings nobody can patch yet.
      - name: Trivy image scan
        id: trivy
        if: steps.docker_build.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image \
            --quiet \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output /reports/trivy.json \
            laravel-security-lab:ci

      # -I: WARN alerts do not fail the run; the FAIL rules live in zap/baseline.conf.
      - name: OWASP ZAP baseline scan
        id: zap
        if: steps.start_app.outcome == 'success'
        continue-on-error: true
        run: |
          cp zap/baseline.conf reports/zap-baseline.conf
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -c zap-baseline.conf \
            -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Application log on failure
        if: always() && steps.start_app.outcome == 'success'
        run: docker compose logs app > reports/app.log 2>&1 || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      # Only "success" passes: a failed, skipped or cancelled step fails the gate.
      - name: Enforce security gates
        if: always()
        env:
          RESULTS: |
            Application start|${{ steps.start_app.outcome }}
            Pest tests|${{ steps.pest.outcome }}
            PHPStan|${{ steps.phpstan.outcome }}
            Composer Audit|${{ steps.composer_audit.outcome }}
            Gitleaks|${{ steps.gitleaks.outcome }}
            Container build|${{ steps.docker_build.outcome }}
            Trivy|${{ steps.trivy.outcome }}
            OWASP ZAP|${{ steps.zap.outcome }}
        run: |
          failed=0
          {
            echo "### Security gate results"
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r name result; do
            [ -z "$name" ] && continue
            echo "| $name | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              echo "Security gate failed: $name ($result)"
              failed=1
            fi
          done <<EOF
          $RESULTS
          EOF
          exit "$failed"

      - name: Stop the application
        if: always()
        run: docker compose down -v
