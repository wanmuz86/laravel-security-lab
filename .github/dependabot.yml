version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security-review"
    commit-message:
      prefix: "deps"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Workflow actions are part of the supply chain too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    labels:
      - "dependencies"
      - "security-review"
    commit-message:
      prefix: "ci"
